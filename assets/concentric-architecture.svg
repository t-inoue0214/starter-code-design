<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" font-family="sans-serif">
  <title>Onion Architecture と Clean Architecture の同心円</title>
  <desc>左が Onion Architecture（2008年）、右が Clean Architecture（2012年）。どちらも外側から内側へだけ依存する。</desc>
  <rect x="0" y="0" width="820" height="470" rx="8" fill="#ffffff"/>
  <g stroke="#3f5f8f" stroke-width="1.5" text-anchor="middle" fill="#1b2a41">
    <text x="205" y="26" font-size="15" stroke="none" font-weight="bold">Onion Architecture（2008年）</text>
    <circle cx="205" cy="240" r="165" fill="#e8eef7"/>
    <circle cx="205" cy="240" r="127" fill="#cfe0f3"/>
    <circle cx="205" cy="240" r="89" fill="#a9c8e8"/>
    <circle cx="205" cy="240" r="51" fill="#7fb0dc"/>
    <text x="205" y="102" font-size="12" stroke="none">UI・インフラ・テスト</text>
    <text x="205" y="140" font-size="12" stroke="none">アプリサービス</text>
    <text x="205" y="178" font-size="12" stroke="none">ドメインサービス</text>
    <text x="205" y="236" font-size="13" stroke="none" font-weight="bold">ドメイン</text>
    <text x="205" y="254" font-size="13" stroke="none" font-weight="bold">モデル</text>
    <text x="615" y="26" font-size="15" stroke="none" font-weight="bold">Clean Architecture（2012年）</text>
    <circle cx="615" cy="240" r="165" fill="#e8eef7"/>
    <circle cx="615" cy="240" r="127" fill="#cfe0f3"/>
    <circle cx="615" cy="240" r="89" fill="#a9c8e8"/>
    <circle cx="615" cy="240" r="51" fill="#7fb0dc"/>
    <text x="615" y="102" font-size="12" stroke="none">フレームワーク</text>
    <text x="615" y="140" font-size="12" stroke="none">アダプタ</text>
    <text x="615" y="178" font-size="12" stroke="none">ユースケース</text>
    <text x="615" y="245" font-size="13" stroke="none" font-weight="bold">エンティティ</text>
    <text x="410" y="450" font-size="14" stroke="none">どちらも、依存は「外から内へ」だけ向かう（内側は外側を知らない）</text>
  </g>
</svg>
